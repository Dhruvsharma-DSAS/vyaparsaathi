# Render Blueprint for the VyaparSaathi Python API.
# In Render: New > Blueprint > pick this repository. Render reads this file and creates the service.
services:
  - type: web
    name: vyaparsaathi-api
    runtime: python
    rootDir: vyaparsaathi-ai
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.6"
      - key: GOOGLE_API_KEY
        sync: false # you are asked for the value when the Blueprint is created
      - key: GROQ_API_KEY
        sync: false # from https://console.groq.com/keys
      - key: LLM_PROVIDER
        value: gemini # "groq" to try Groq first
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
