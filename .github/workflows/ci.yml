name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: Web app (Next.js + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyaparsaathi-ui
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyapar
          POSTGRES_PASSWORD: vyapar
          POSTGRES_DB: vyaparsaathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyapar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vyapar:vyapar@localhost:5432/vyaparsaathi
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vyaparsaathi-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and import all data
        run: npm run db:setup
      - run: npm run build

  api:
    name: Python API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyaparsaathi-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vyaparsaathi-ai/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
